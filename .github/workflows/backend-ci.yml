name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff · mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install (incl. dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # `|| true` while mypy coverage grows — flip to hard-gate once the
        # whole app is typed.
        run: mypy app || true

  tests:
    name: pytest (with Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Load Postgres extensions
        # The init.sql CREATEs the pgvector / pg_trgm / etc. extensions our
        # migrations assume. Compose runs this automatically; in CI we
        # `psql` it in manually. Path is from repo root — override the
        # default working-directory so it resolves predictably.
        working-directory: ${{ github.workspace }}
        env:
          PGPASSWORD: memory
        run: |
          psql -h localhost -U memory -d memory -f ops/postgres/init.sql

      - name: Run migrations
        env:
          POSTGRES_URL: postgresql+asyncpg://memory:memory@localhost:5432/memory
          POSTGRES_SYNC_URL: postgresql://memory:memory@localhost:5432/memory
          JWT_SECRET: ci-secret
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      - name: Pytest
        env:
          POSTGRES_URL: postgresql+asyncpg://memory:memory@localhost:5432/memory
          POSTGRES_SYNC_URL: postgresql://memory:memory@localhost:5432/memory
          JWT_SECRET: ci-secret
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test
          OPENAI_API_KEY: test
          PUBLIC_BASE_URL: http://localhost:8000
        run: pytest -v
